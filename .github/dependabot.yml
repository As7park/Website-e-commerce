version: 2
updates:
  # Groupé + hebdomadaire : limite le bruit de PRs sur un projet avec
  # ~200 dépendances. Les mises à jour de
  # sécurité passent en dehors de ce planning (Dependabot les ouvre dès
  # qu'une alerte est détectée, indépendamment du `schedule` ci-dessous).
  # Les PR visent `dev` (branche de travail), jamais `main` directement :
  # elles passent par une preview Vercel avant d'être fusionnées dans `main`.
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      development-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    # Les mises à jour majeures (breaking changes potentiels : Svelte,
    # SvelteKit, Prisma, Stripe...) restent ouvertes individuellement,
    # jamais groupées, pour ne pas masquer une régression dans un lot.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
    # Une seule PR pour toutes les actions (checkout, setup-node...) au lieu
    # d'une par action.
    groups:
      github-actions:
        patterns: ['*']
