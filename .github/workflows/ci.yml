name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (prettier)
        # Non-bloquant : ~383 fichiers non formatés (dette pré-existante).
        # Étape séparée d'eslint pour ne pas masquer ses erreurs (le script
        # combiné `prettier && eslint` court-circuitait eslint dès que
        # prettier échouait). À rendre bloquant une fois résorbée.
        run: npm run lint:prettier
        continue-on-error: true

      - name: Lint (eslint)
        # Non-bloquant : ~158 erreurs pré-existantes sur le code applicatif
        # (static/tinymce, vendorisé, est exclu de la config eslint).
        # À rendre bloquant une fois résorbée.
        run: npm run lint:eslint
        continue-on-error: true

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Audit (production dependencies)
        # Non-bloquant pour l'instant : signale les vulnérabilités sans
        # casser la CI le temps de traiter les cas nécessitant un bump majeur.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
